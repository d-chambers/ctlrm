name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov ctlrm --cov-report term-missing
      - run: uv build
      - name: Test installed wheel outside source tree
        run: |
          uv venv /tmp/ctlrm-wheel
          uv pip install --python /tmp/ctlrm-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/ctlrm-wheel/bin/ctlrm --help
