schema_version: 1
name: implement-review
entry: implement
limits:
  max_task_executions: 12
profiles:
  coding-agent:
    provider: codex
    executable: codex
    context: ~/.codex
    input_mode: native
    arguments: [--sandbox, workspace-write]
roles:
  implementer:
    kind: agent
    profile: coding-agent
    instructions: Implement the task, run applicable checks, and report the result. Address requested changes on later visits.
  reviewer:
    kind: agent
    profile: coding-agent
    instructions: Review the assigned artifact and checks. Do not edit project files. Report approved or changes_requested with concrete findings.
  owner:
    kind: human
    instructions: Inspect the reviewed artifact and accept or reject the result.
tasks:
  implement:
    role: implementer
    instructions: Implement the job goal and address findings from earlier reviews.
    verify_input: false
    transitions:
      completed: review
  review:
    role: reviewer
    instructions: Review the current changes for correctness and compatibility.
    verify_input: true
    transitions:
      approved: approve
      changes_requested: implement
  approve:
    role: owner
    verify_input: true
    transitions:
      approved: terminal:completed
      rejected: terminal:rejected
