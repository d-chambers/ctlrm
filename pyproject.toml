[project]
name = "ctlrm"
dynamic = ["version"]
description = "TUI workbench for orchestrating CLI agents and human workflow participants"
requires-python = ">=3.11"
dependencies = [
    "libtmux>=0.62,<0.63",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "textual>=0.70",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.scripts]
ctlrm = "ctlrm.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/ctlrm"]
