[project]
name = "ctlrm"
dynamic = ["version"]
description = "Local web workbench for orchestrating CLI agents and human workflow participants"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "libtmux>=0.62,<0.63",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "websockets>=14,<17",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/d-chambers/ctlrm"
Documentation = "https://github.com/d-chambers/ctlrm/tree/main/docs"
Issues = "https://github.com/d-chambers/ctlrm/issues"

[project.scripts]
ctlrm = "ctlrm.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/ctlrm"]
